    <text x="75" y="69" fill="#82ead3" font-size="12" font-weight="700" letter-spacing="1.7">BLOCKBENCH DESKTOP</text>
    <text x="56" y="150" fill="#f5f7fb" font-size="55" font-weight="750" letter-spacing="-2">GLB Rig Importer</text>
    <text x="58" y="207" fill="#82ead3" font-size="29" font-weight="500">Bring the mesh.</text>
    <text x="58" y="248" fill="#f5f7fb" font-size="29" font-weight="500">Keep the motion.</text>
    <text x="59" y="304" fill="#a4b2c9" font-size="18">Native bones. Blended weights.</text>
    <text x="59" y="334" fill="#a4b2c9" font-size="18">Animations you can keep editing.</text>
    <g transform="translate(58 382)" font-size="13" font-weight="600">
      <rect width="83" height="34" rx="8" fill="#22314a"/><text x="22" y="22" fill="#d6e1f4">.GLB</text>
      <path d="M98 17h27m-6-5 6 5-6 5" fill="none" stroke="#607b9e" stroke-width="2"/>
      <rect x="142" width="119" height="34" rx="8" fill="#1c3939"/><text x="161" y="22" fill="#82ead3">NATIVE RIG</text>
      <path d="M277 17h27m-6-5 6 5-6 5" fill="none" stroke="#607b9e" stroke-width="2"/>
      <rect x="322" width="118" height="34" rx="8" fill="#22314a"/><text x="340" y="22" fill="#d6e1f4">.BBMODEL</text>
    </g>
    <g transform="translate(700 39)">
      <text x="31" y="30" fill="#7890ae" font-size="11" letter-spacing="2">WEIGHTED MESH / SCHEMATIC</text>
      <path d="M145 305 235 305 246 237 157 222 284 169 230 119 345 89 313 37" fill="none" stroke="#31445e" stroke-width="1.5"/>
      <path d="M145 305 235 305 246 237 284 169 345 89 313 37 230 119 157 222Z" fill="url(#ribbon)" stroke="#58d6bc" stroke-width="2"/>
      <g stroke="#7ee1cc" stroke-width="1" opacity=".65" fill="none">
        <path d="m145 305 101-68m-11 68-78-83m0 0 127-53m-38 68-16-118m0 0 115-30m-61 80 29-132"/>
        <path d="m157 222 89 15m-16-118 54 50m29-132 32 52"/>
