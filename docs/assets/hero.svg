<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">GLB Rig Importer — bring the mesh, keep the motion</title>
  <desc id="desc">An original schematic of a weighted ribbon, skeleton joints and an animation timeline. Direct GLB import into native Blockbench rigs.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#101d30"/><stop offset="1" stop-color="#101522"/></linearGradient>
    <linearGradient id="ribbon" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#58d6bc" stop-opacity=".12"/><stop offset="1" stop-color="#58d6bc" stop-opacity=".48"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M 36 0 L 0 0 0 36" fill="none" stroke="#31425b" stroke-width="1" opacity=".32"/></pattern>
  </defs>
  <rect width="1280" height="520" rx="24" fill="url(#background)"/>
  <rect x="690" y="25" width="565" height="410" rx="18" fill="url(#grid)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
