      </g>
      <g fill="#a3f2e1"><circle cx="145" cy="305" r="4"/><circle cx="235" cy="305" r="4"/><circle cx="157" cy="222" r="4"/><circle cx="246" cy="237" r="4"/><circle cx="230" cy="119" r="4"/><circle cx="284" cy="169" r="4"/><circle cx="313" cy="37" r="4"/><circle cx="345" cy="89" r="4"/></g>
