name: Import bug
description: Report a GLB import, skinning or animation problem.
title: "[Bug]: "
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Blockbench version, operating system and plugin version.
    validations:
      required: true
  - type: input
    id: options
    attributes:
      label: Import settings
      description: Coordinate scale and animation sampling FPS.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include expected and actual behavior, and whether saving/reopening changes it.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal sample and diagnostics
      description: Share a small GLB only if you have redistribution rights. Remove private paths and data.
